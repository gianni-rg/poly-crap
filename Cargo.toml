[package]
name = "poly-crap"
version = "0.8.2"
publish = ["crates-io"]
edition = "2024"
rust-version = "1.99"
description = "Find risky, untested complexity across polyglot codebases"
authors = ["Drew Simmons \u003cdsimmo14@gmail.com\u003e"]
license = "MIT"
repository = "https://github.com/drew-simmons/poly-crap"
homepage = "https://drew-simmons.github.io/poly-crap/"
documentation = "https://drew-simmons.github.io/poly-crap/"
readme = "README.md"
keywords = ["coverage", "complexity", "code-quality", "metrics", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["/docs", "/.github"]

[package.metadata.dist]
dist = true

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
quick-xml = "0.42"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
assert_cmd = "2"
jsonschema = { version = "0.58.6", default-features = false }
predicates = "3"
tempfile = "3"

# The profile that dist uses for release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
